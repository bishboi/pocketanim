name: apk

# Builds both apps and attaches their APKs to the run: the player someone
# actually watches a scene in, and the benchmark that measures whether it can
# keep up.
#
# The environment this project is developed in cannot reach dl.google.com, so it
# has no Android SDK and cannot produce an APK. GitHub's runners ship one. This
# is therefore the only place the app can actually be built, and the artifact it
# uploads is how the APK gets to a phone.

on:
  workflow_dispatch:
  push:
    paths:
      - "player/**"
      - ".github/workflows/apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # No setup-android action: the runner already ships the SDK at
      # $ANDROID_HOME, and the action's `sdkmanager tools` step fails against
      # current SDKs because the `tools` package was removed years ago. AGP
      # fetches any missing platform or build-tools itself.
      - name: Show the preinstalled SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" 2>/dev/null || true
          yes | "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager --licenses > /dev/null 2>&1 || true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Pack the scene library into both apps
        # The scenes ship inside the APK. The player needs that so it opens
        # offline; the benchmark needs it so nothing can perturb a measurement
        # mid-run. It is the same library, built once and copied.
        run: |
          pip install numpy
          python -m tools.build_library --out player/benchmark/src/main/assets/library
          cp -r player/benchmark/src/main/assets/library player/app/src/main/assets/library
          du -sh player/benchmark/src/main/assets/library

      - name: Build
        # Release, not debug: a debug build has assertions on and optimisation
        # off, and reports frame times that mean nothing. Both are signed with
        # the auto-generated debug key, which is enough to install by hand.
        working-directory: player
        run: ./gradlew --no-daemon :app:assembleRelease :benchmark:assembleRelease

      - name: Name the artifacts after the commit
        id: meta
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: pocketanim-player-${{ steps.meta.outputs.sha }}
          path: player/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: pocketanim-benchmark-${{ steps.meta.outputs.sha }}
          path: player/benchmark/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Report
        run: |
          {
            echo "### APKs built"
            echo '```'
            find player/app/build/outputs/apk/release player/benchmark/build/outputs/apk/release \
              -name '*.apk' -exec ls -lh {} \;
            echo '```'
            echo 'Download them from the **Artifacts** section of this run.'
            echo
            echo '**pocketanim-player** — tap to open, it plays the sample scene.'
            echo '```'
            echo 'adb install -r app-release.apk'
            echo 'adb shell am start -n com.pocketanim.player/.PlayerActivity'
            echo '```'
            echo '**pocketanim-benchmark** — the device gate.'
            echo '```'
            echo 'adb install -r benchmark-release.apk'
            echo 'adb shell am start -n com.pocketanim.benchmark/.BenchmarkActivity'
            echo 'adb logcat -s panim:I'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
