<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>harness v3</title>
<style>
  :root { --bg:#0b0d10; --panel:#13161b; --line:#262b33; --ink:#e7e9ee; --soft:#8b93a1; --accent:#f08a5d;
          --ok:#52c41a; --run:#4ea1ff; --bad:#ff5d5d; --wait:#5b6370; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:13px/1.45 Inter, system-ui, sans-serif; }
  header { display:flex; align-items:center; gap:12px; padding:10px 16px; border-bottom:1px solid var(--line); }
  header b { font-size:15px; } header .soft { color:var(--soft); }
  .wrap { display:grid; grid-template-columns: 280px 1fr; min-height: calc(100vh - 45px); }
  aside { border-right:1px solid var(--line); padding:12px; overflow:auto; }
  main { padding:16px; overflow:auto; }
  button { background:#1d2229; color:var(--ink); border:1px solid var(--line); border-radius:6px; padding:5px 10px;
           font:inherit; cursor:pointer; } button:hover { border-color:#3a414c; } button:disabled { opacity:.4; cursor:default; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#1b0f08; font-weight:600; }
  input, select, textarea { background:#0f1216; color:var(--ink); border:1px solid var(--line); border-radius:6px;
           padding:6px 8px; font:inherit; width:100%; }
  textarea.mono, pre { font:12px/1.4 "JetBrains Mono", ui-monospace, monospace; }
  .run { padding:8px; border:1px solid var(--line); border-radius:8px; margin-top:8px; cursor:pointer; }
  .run:hover, .run.sel { border-color:var(--accent); }
  .run .t { font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .chip { display:inline-block; padding:1px 7px; border-radius:99px; font-size:11px; background:#1d2229; color:var(--soft); }
  .chip.done { background:#16301a; color:#8ee07a; } .chip.running { background:#122840; color:#8cc2ff; }
  .chip.failed { background:#3a1414; color:#ff9a9a; } .chip.waiting { background:#1b1f25; color:var(--soft); }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .soft { color:var(--soft); }
  .steps { display:grid; grid-template-columns: repeat(5, 1fr); gap:8px; margin:12px 0; }
  .step { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px; }
  .step h4 { margin:0 0 6px; font-size:12px; text-transform:uppercase; letter-spacing:.06em; }
  .step .notes { color:var(--soft); font-size:11px; max-height:90px; overflow:auto; margin-top:6px; white-space:pre-wrap; }
  .step .err { color:#ff9a9a; font-size:11px; max-height:120px; overflow:auto; white-space:pre-wrap; margin-top:6px; }
  .tabs { display:flex; gap:4px; border-bottom:1px solid var(--line); margin-top:8px; }
  .tabs button { border:none; border-bottom:2px solid transparent; border-radius:0; background:none; color:var(--soft); }
  .tabs button.on { color:var(--ink); border-bottom-color:var(--accent); }
  .pane { padding-top:12px; }
  .two { display:grid; grid-template-columns: 1fr 1fr; gap:12px; }
  @media (max-width: 1100px) { .two, .steps { grid-template-columns: 1fr; } }
  video { width:100%; border-radius:8px; background:#000; }
  table { width:100%; border-collapse:collapse; } td, th { padding:6px 8px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; }
  th { color:var(--soft); font-weight:500; font-size:12px; }
  tr.call { cursor:pointer; } tr.call:hover td { background:#151a20; }
  pre { background:#0f1216; border:1px solid var(--line); border-radius:6px; padding:8px; white-space:pre-wrap; max-height:340px; overflow:auto; margin:4px 0; }
  .word { display:inline-block; margin:2px; padding:1px 5px; border-radius:4px; background:#161a20; font-size:12px; }
  .word i { color:var(--soft); font-style:normal; font-size:10px; margin-left:3px; }
  .big { font-size:18px; font-weight:700; }
  .money { color:#ffd27a; }
  .form { display:grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap:10px; }
  .form label { color:var(--soft); font-size:12px; } .form .full { grid-column: 1 / -1; }
  .side h5 { margin:14px 0 2px; color:var(--soft); font-size:11px; text-transform:uppercase; letter-spacing:.06em; }
  .chip.queued { background:#2a2410; color:#ffd27a; }
  .bookgrid { display:grid; grid-template-columns: minmax(320px, 42%) 1fr; gap:12px; margin-top:12px; }
  @media (max-width: 1100px) { .bookgrid { grid-template-columns: 1fr; } }
  .pdf { width:100%; height:78vh; border:1px solid var(--line); border-radius:8px; background:#fff; }
  .sec { padding:4px 6px; border-radius:6px; cursor:pointer; display:flex; justify-content:space-between; gap:8px; }
  .sec:hover { background:#161a20; } .sec.on { background:#2a1d14; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px; margin-top:10px; }
  .vid { border-top:1px solid var(--line); padding-top:8px; margin-top:8px; }
  .banner { background:#2a2010; border:1px solid #5a4416; color:#ffd27a; border-radius:8px; padding:8px 10px; margin:8px 0; }
</style>
</head>
<body>
<header><b>harness v3</b><span class="soft">animated explainers from a score</span><span id="key" class="chip"></span>
  <span style="flex:1"></span><span class="soft">all runs and scripts: <span id="allcost" class="money"></span></span></header>
<div class="wrap">
  <aside>
    <div class="side"><div class="row" style="flex-wrap:nowrap">
      <button class="primary" style="flex:1" onclick="$('#pdfpick').click()">+ Upload PDF</button>
      <button style="flex:1" onclick="showNew()">+ New run</button></div>
    <input type="file" id="pdfpick" accept="application/pdf,.pdf" style="display:none" onchange="upload(this.files[0])">
    <h5>Books</h5><div id="books"></div>
    <h5>Runs</h5><div id="runs"></div></div>
  </aside>
  <main id="main"><p class="soft">Pick a run, or make a new one.</p></main>
</div>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const usd = (v) => v ? "$" + (v < 0.01 ? v.toFixed(5) : v.toFixed(4)) : "$0";
const secs = (v) => v == null ? "" : (v < 60 ? v.toFixed(1) + " s" : Math.floor(v / 60) + " min " + Math.round(v % 60) + " s");
let bsel = null, bdata = null, btimer = null, range = null, bopen = {}, btab = "script";
let config = {}, sel = null, data = null, tab = "video", opened = {}, timer = null, dirty = false;

async function api(path, opts) {
  const r = await fetch(path, opts);
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}

async function loadRuns() {
  const [list, bl] = await Promise.all([api("/api/runs"), api("/api/books")]);
  $("#allcost").textContent = usd(list.reduce((k, r) => k + (r.cost || 0), 0) + bl.reduce((k, b) => k + (b.script_cost || 0), 0));
  $("#books").innerHTML = bl.map((b) => `<div class="run ${b.id === bsel ? "sel" : ""}" onclick="pickBook('${b.id}')">
    <div class="t">📄 ${esc(b.title)}</div>
    <div class="row soft"><span class="chip ${b.status}">${b.status}</span><span class="money">${usd(b.cost)}</span>
      <span>${b.pages} pages</span><span>${b.videos} videos</span></div></div>`).join("") || `<p class="soft">No books yet.</p>`;
  $("#runs").innerHTML = list.map((r) => `<div class="run ${r.id === sel ? "sel" : ""}" onclick="pick('${r.id}')">
    <div class="t">${esc(r.title)}</div>
    <div class="row soft"><span class="chip ${r.status}">${r.status}</span><span class="money">${usd(r.cost)}</span>
      <span>${r.tokens || 0} tok</span>${r.seconds ? `<span>${r.seconds.toFixed(0)} s</span>` : ""}</div></div>`).join("")
    || `<p class="soft">No runs yet.</p>`;
}

function pick(id) { bsel = null; clearTimeout(btimer); sel = id; dirty = false; tab = tab || "video"; refresh(true); loadRuns(); }

async function refresh(force) {
  if (!sel) return;
  const d = await api("/api/runs/" + sel);
  const changed = force || JSON.stringify(d.run) !== JSON.stringify(data?.run) || d.busy !== data?.busy;
  data = d;
  if (changed) render();
  clearTimeout(timer);
  if (d.busy || d.run.status === "running") timer = setTimeout(() => { refresh(); loadRuns(); }, 1500);
}

function stepCard(name) {
  const s = data.run.steps[name] || {};
  const shots = name === "score" && data.storyboard ? `<div class="row" style="margin-top:6px">${data.storyboard.map((x, k) =>
    `<button title="score this shot again" onclick="again('score', ${k})" ${data.busy ? "disabled" : ""}>↻ ${k + 1}</button>`).join("")}</div>` : "";
  return `<div class="step"><h4>${name}</h4>
    <div class="row"><span class="chip ${s.status || "waiting"}">${s.status || "waiting"}</span>
      ${s.seconds != null ? `<span class="soft">${secs(s.seconds)}</span>` : ""}
      ${s.cost ? `<span class="money">${usd(s.cost)}</span>` : ""}</div>
    ${s.error ? `<div class="err">${esc(s.error)}</div>` : ""}
    ${(s.notes || []).length ? `<div class="notes">${esc(s.notes.join("\n"))}</div>` : ""}
    <div class="row" style="margin-top:8px"><button onclick="again('${name}')" ${data.busy ? "disabled" : ""}>run from here</button></div>${shots}</div>`;
}

function render() {
  const r = data.run, st = r.settings;
  const calls = r.calls || [];
  const byStep = {};
  for (const c of calls) byStep[c.step] = (byStep[c.step] || 0) + (c.cost || 0);
  $("#main").innerHTML = `
    <div class="row"><span class="big">${esc(r.title)}</span><span class="chip ${r.status}">${r.status}</span>
      <span class="money big">${usd(r.cost)}</span><span class="soft">${r.tokens || 0} tokens · ${calls.length} calls</span></div>
    ${st.book ? `<div class="row soft" style="margin-top:4px">from 📄 <a href="#" style="color:var(--accent)" onclick="pickBook('${st.book.id}');return false">${esc(st.book.title)}</a> · pages ${esc(st.book.pages)} · video ${st.book.video + 1}</div>` : ""}
    <div class="row soft" style="margin-top:4px">model ${esc(st.model)} · voice ${esc(st.voice)} · quality ${st.quality}
      · critic ${st.critic ? "on" : "off"}${st.given_score ? " · score given by hand" : ""} · ${new Date(r.created * 1000).toLocaleString()}
      ${r.words ? ` · ${r.words.count} words, ${r.words.seconds.toFixed(1)} s` : ""}</div>
    ${!config.key && !st.given_score ? `<div class="banner">No OPENROUTER_API_KEY on the server: the storyboard and score steps need it. Set it and run the storyboard step again, or edit the score by hand below.</div>` : ""}
    <div class="steps">${["voice", "storyboard", "score", "render", "critic"].map(stepCard).join("")}</div>
    <div class="row soft">cost by step: ${Object.entries(byStep).map(([k, v]) => `${k} <span class="money">${usd(v)}</span>`).join(" · ") || "none yet"}</div>
    <div class="tabs">${["video", "words", "storyboard", "calls"].map((t) =>
      `<button class="${tab === t ? "on" : ""}" onclick="tab='${t}';render()">${{video: "Video & score", words: "Narration & words", storyboard: "Storyboard", calls: `Calls (${calls.length})`}[t]}</button>`).join("")}</div>
    <div class="pane" id="pane"></div>`;
  pane();
}

function pane() {
  const p = $("#pane");
  if (tab === "video") {
    p.innerHTML = `<div class="two">
      <div>${data.video ? `<video controls src="/files/${sel}/video.mp4?v=${data.run.steps.render?.ended || 0}"></video>` : `<p class="soft">No video yet.</p>`}
        <p class="soft">The score on the right is what the video plays. Change it and save: only the render runs again.</p></div>
      <div><textarea id="score" class="mono" style="height:62vh" oninput="dirty=true">${esc(data.score || "")}</textarea>
        <div class="row" style="margin-top:6px"><button class="primary" onclick="saveScore()" ${data.busy ? "disabled" : ""}>Save score and re-render</button>
        <span class="soft">${data.run.edited ? "edited by hand " + new Date(data.run.edited * 1000).toLocaleTimeString() : ""}</span></div></div></div>`;
  } else if (tab === "words") {
    const w = data.words;
    p.innerHTML = w ? `${w.lines.map((l, i) => `<p><b>${secs(l.start)}–${secs(l.end)}</b> ${esc(l.text)}<br>${
        w.words.filter((x) => x.line === i).map((x) => `<span class="word">w${x.i} ${esc(x.w)}<i>${x.start.toFixed(2)}</i></span>`).join("")}</p>`).join("")}
      <audio controls src="/files/${sel}/voice.wav"></audio>` : `<pre>${esc(data.narration)}</pre><p class="soft">Not spoken yet.</p>`;
  } else if (tab === "storyboard") {
    p.innerHTML = data.storyboard ? `<table><tr><th>#</th><th>shot</th><th>words</th><th>plan</th><th></th></tr>${data.storyboard.map((s, k) =>
      `<tr><td>${k + 1}</td><td>${esc(s.name)}</td><td>w${s.a}–w${s.b}</td><td>${esc(s.plan)}</td>
       <td><button onclick="again('score', ${k})" ${data.busy ? "disabled" : ""}>score again</button></td></tr>`).join("")}</table>`
      : `<p class="soft">${data.run.settings.given_score ? "The score was given by hand: no storyboard." : "No storyboard yet."}</p>`;
  } else {
    p.innerHTML = callsTable(data.run.calls || [], data.run.cost, opened, "opened", "pane()");
  }
}

function callsTable(calls, cost, o, store, redraw) {
  return calls.length ? `<table><tr><th>step</th><th>call</th><th>model</th><th>status</th><th>tokens in / out</th><th>cost</th><th>time</th></tr>${calls.map((c) =>
    `<tr class="call" onclick="${store}['${c.id}']=!${store}['${c.id}'];${redraw}"><td>${c.step}</td><td>${esc(c.label)}${c.images ? ` · ${c.images} images` : ""}</td>
     <td>${esc(c.model)}</td><td><span class="chip ${c.status}">${c.status}</span></td><td>${c.tokens_in ?? ""} / ${c.tokens_out ?? ""}</td>
     <td class="money">${usd(c.cost)}</td><td>${secs(c.seconds)}</td></tr>
     ${o[c.id] ? `<tr><td colspan="7">${c.error ? `<pre style="color:#ff9a9a">${esc(c.error)}</pre>` : ""}
       <div class="soft">system</div><pre>${esc(c.system)}</pre><div class="soft">user</div><pre>${esc(c.user)}</pre>
       <div class="soft">answer</div><pre>${esc(c.output || "")}</pre></td></tr>` : ""}`).join("")}
    <tr><th colspan="4">total</th><th>${calls.reduce((k, c) => k + (c.tokens_in || 0), 0)} / ${calls.reduce((k, c) => k + (c.tokens_out || 0), 0)}</th>
      <th class="money">${usd(cost)}</th><th>${secs(calls.reduce((k, c) => k + (c.seconds || 0), 0))}</th></tr></table>`
    : `<p class="soft">No model calls yet.</p>`;
}

async function again(step, shot) {
  try { await api(`/api/runs/${sel}/step`, {method: "POST", body: JSON.stringify({step, shot})}); refresh(true); loadRuns(); }
  catch (e) { alert(e.message); }
}

async function saveScore() {
  try { await api(`/api/runs/${sel}/score`, {method: "PUT", body: JSON.stringify({text: $("#score").value})}); dirty = false; refresh(true); }
  catch (e) { alert(e.message); }
}

function showNew() {
  sel = null; bsel = null; clearTimeout(btimer); clearTimeout(timer); loadRuns();
  const opt = (xs, v) => xs.map((x) => `<option ${x === v ? "selected" : ""}>${esc(x)}</option>`).join("");
  $("#main").innerHTML = `<p class="big">New run</p>
    <div class="form">
      <div class="full"><label>Title</label><input id="n-title" placeholder="(the first line, if empty)"></div>
      <div class="full"><label>Narration: one sentence a line (about 40 s is 80-100 words)</label>
        <textarea id="n-text" rows="8" placeholder="In 1853, four American warships sailed into Tokyo Bay."></textarea></div>
      <div><label>Model (storyboard, score, critic)</label><select id="n-model">${opt(config.models, config.default_model)}</select></div>
      <div><label>Voice</label><select id="n-voice">${opt(config.voices, "en_US-ryan-high")}</select></div>
      <div><label>Quality</label><select id="n-q"><option value="l">480p (fast)</option><option value="m" selected>720p</option><option value="h">1080p</option></select></div>
      <div><label>Voice speed (length scale) / pause</label><div class="row" style="flex-wrap:nowrap"><input id="n-speed" value="1.22"><input id="n-pause" value="0.85"></div></div>
      <div class="full"><label><input type="checkbox" id="n-critic" style="width:auto"> Critic: frames judged by the model after the render</label></div>
      <div class="full"><label>Score by hand (optional: skips the storyboard and score calls)</label>
        <textarea id="n-score" class="mono" rows="6" placeholder="shot one at 0,0&#10;ent title text &quot;Hello&quot; size 1 at 0,0&#10;w0 in title write"></textarea></div>
    </div>
    ${!config.key ? `<div class="banner">No OPENROUTER_API_KEY on the server: give a score by hand, or set the key and restart the server.</div>` : ""}
    <p><button class="primary" onclick="create()">Make it</button></p>`;
}

async function create() {
  const body = {title: $("#n-title").value, narration: $("#n-text").value, model: $("#n-model").value, voice: $("#n-voice").value,
    quality: $("#n-q").value, speed: $("#n-speed").value, pause: $("#n-pause").value, critic: $("#n-critic").checked,
    score: $("#n-score").value.trim() || undefined};
  try { const r = await api("/api/runs", {method: "POST", body: JSON.stringify(body)}); tab = "video"; pick(r.id); }
  catch (e) { alert(e.message); }
}

// ---------------------------------------------------------------- books ----------------------------------------------

async function upload(file) {
  if (!file) return;
  if (!config.datalab) { alert("DATALAB_API_KEY is not set on the server: PDFs are read by Datalab. Set it and restart the server."); $("#pdfpick").value = ""; return; }
  $("#pdfpick").value = "";
  sel = null; clearTimeout(timer);
  $("#main").innerHTML = `<p class="soft">Reading ${esc(file.name)}…</p>`;
  try {
    const r = await api("/api/books", {method: "POST", headers: {"X-Filename": encodeURIComponent(file.name)}, body: file});
    pickBook(r.id);
  } catch (e) { $("#main").innerHTML = `<div class="banner">${esc(e.message)}</div>`; }
}

function pickBook(id) { sel = null; clearTimeout(timer); bsel = id; range = null; bdata = null; refreshBook(true); loadRuns(); }

async function refreshBook(force) {
  if (!bsel) return;
  const d = await api("/api/books/" + bsel);
  const changed = force || JSON.stringify(d) !== JSON.stringify(bdata);
  bdata = d;
  if (changed && !editing()) renderBook();
  clearTimeout(btimer);
  const live = d.busy || d.book.status === "reading" || d.book.scripts.some((s) => s.videos.some((v) => v.run_info && ["running", "queued", "new"].includes(v.run_info.status)));
  if (live) btimer = setTimeout(() => { refreshBook(); loadRuns(); }, 2000);
}

// a narration being typed is not redrawn under the cursor
const editing = () => document.activeElement && document.activeElement.matches("#main textarea, #main input");

function renderBook() {
  const d = bdata, b = d.book;
  if (b.status !== "done") range = null;
  else if (!range) range = b.sections[0] ? {from: b.sections[0].from, to: b.sections[0].to} : {from: 1, to: Math.min(b.pages, 4)};
  const byStep = {read: b.read.cost || 0, script: b.cost || 0, videos: d.videos.cost};
  const opt = (xs, v) => xs.map((x) => `<option ${x === v ? "selected" : ""}>${esc(x)}</option>`).join("");
  const scripts = b.scripts.slice().reverse();
  const built = scripts.reduce((k, s) => k + s.videos.filter((v) => v.run).length, 0);
  const total = scripts.reduce((k, s) => k + s.videos.length, 0);
  $("#main").innerHTML = `
    <div class="row"><span class="big">📄 ${esc(b.title)}</span><span class="money big">${usd(d.total.cost)}</span>
      <span class="soft">${d.total.tokens} tokens · ${b.calls.length} script calls · ${d.videos.count} videos made</span></div>
    <div class="row soft" style="margin-top:4px">${esc(b.name)} · ${b.pages} pages · ${new Date(b.created * 1000).toLocaleString()}</div>
    ${!config.key ? `<div class="banner">No OPENROUTER_API_KEY on the server: writing a script (and each video's storyboard and score) needs it.</div>` : ""}
    <div class="steps" style="grid-template-columns: repeat(3, 1fr)">
      <div class="step"><h4>read (Datalab)</h4><div class="row"><span class="chip ${b.read.status}">${b.read.status}</span><span class="soft">${secs(b.read.seconds)}</span>
        ${b.read.cost ? `<span class="money">${usd(b.read.cost)}</span>` : ""}</div>
        ${b.read.error ? `<div class="err">${esc(b.read.error)}</div>` : ""}
        <div class="notes">${esc(b.read.status === "running" ? "Datalab is converting the PDF (a minute or a few)…" : (b.read.notes || []).join("\n"))}</div></div>
      <div class="step"><h4>script</h4><div class="row"><span class="chip ${d.busy ? "running" : !b.scripts.length ? "waiting" : b.scripts[b.scripts.length - 1].status}">${d.busy ? "running" : b.scripts.length + " scripts"}</span>
        <span class="money">${usd(byStep.script)}</span><span class="soft">${secs(b.scripts.reduce((k, s) => k + (s.seconds || 0), 0))}</span></div>
        <div class="notes">${total} videos written</div></div>
      <div class="step"><h4>videos</h4><div class="row"><span class="chip ${built ? "done" : "waiting"}">${built} / ${total} built</span>
        <span class="money">${usd(byStep.videos)}</span></div>
        <div class="notes">each one a run: voice, storyboard, score, render, critic (open it for its own breakdown)</div></div>
    </div>
    <div class="row soft">cost: read <span class="money">${usd(byStep.read)}</span> · script <span class="money">${usd(byStep.script)}</span> · videos <span class="money">${usd(byStep.videos)}</span> · total <span class="money">${usd(d.total.cost)}</span></div>
    <div class="tabs">${["script", "text", "calls"].map((t) => `<button class="${btab === t ? "on" : ""}" onclick="btab='${t}';renderBook()">${{script: "Pages & script", text: "Pages' text", calls: `Calls (${b.calls.length})`}[t]}</button>`).join("")}</div>
    <div id="bpane"></div>`;
  const p = $("#bpane");
  if (b.status !== "done") { p.innerHTML = `<div class="bookgrid"><div><iframe class="pdf" src="/books/${bsel}/source.pdf"></iframe></div>
    <div><p class="soft">${b.status === "failed" ? "The PDF could not be read: see the read step above." : "The pages and sections come when Datalab has read the PDF."}</p></div></div>`; return; }
  if (btab === "calls") { p.innerHTML = callsTable(b.calls, b.cost, bopen, "bopen", "renderBook()"); return; }
  if (btab === "text") {
    p.innerHTML = `<p class="soft">Pages ${range.from}–${range.to}: the text the script call reads (up to 40,000 characters).</p><div id="ptext" class="soft">…</div>`;
    api(`/api/books/${bsel}/pages?from=${range.from}&to=${range.to}`).then((ps) => {
      $("#ptext").innerHTML = ps.map((x) => `<div class="soft">page ${x.page}</div><pre>${esc(x.text)}</pre>`).join(""); });
    return;
  }
  p.innerHTML = `<div class="bookgrid">
    <div><iframe class="pdf" src="/books/${bsel}/source.pdf#page=${range.from}"></iframe></div>
    <div>
      <div class="card"><b>1. Pick the pages</b>
        <div style="max-height:200px;overflow:auto;margin-top:6px">${b.sections.map((s) =>
          `<div class="sec ${s.from === range.from && s.to === range.to ? "on" : ""}" style="padding-left:${6 + s.level * 14}px" onclick="range={from:${s.from},to:${s.to}};renderBook()">
             <span>${esc(s.title)}</span><span class="soft">p. ${s.from}–${s.to}</span></div>`).join("")}</div>
        <div class="row" style="margin-top:6px;flex-wrap:nowrap"><span class="soft">pages</span>
          <input id="b-from" type="number" min="1" max="${b.pages}" value="${range.from}" style="width:80px" onchange="range.from=+this.value;renderBook()">
          <span class="soft">to</span><input id="b-to" type="number" min="1" max="${b.pages}" value="${range.to}" style="width:80px" onchange="range.to=+this.value;renderBook()"></div></div>
      <div class="card"><b>2. Write the script</b> <span class="soft">(one model call: the pages as a few short videos)</span>
        <div class="form" style="margin-top:6px">
          <div><label>Model</label><select id="s-model">${opt(config.models, config.default_model)}</select></div>
          <div><label>Videos (at most)</label><input id="s-videos" type="number" min="1" max="12" value="3"></div>
          <div><label>Seconds each</label><input id="s-seconds" type="number" min="15" max="120" value="40"></div>
          <div></div>
          <div class="full"><label>Notes for the writer (optional)</label><input id="s-notes" placeholder="for class 8; start from the monsoon; skip the dates"></div>
        </div>
        <p><button class="primary" onclick="writeScript()" ${d.busy ? "disabled" : ""}>${d.busy ? "Writing…" : `Write the script of pages ${range.from}–${range.to}`}</button></p></div>
      <div class="card"><b>3. Build the videos</b> <span class="soft">(each video a run; they are made one at a time)</span>
        <div class="form" style="margin-top:6px">
          <div><label>Model (storyboard, score, critic)</label><select id="v-model">${opt(config.models, config.default_model)}</select></div>
          <div><label>Voice</label><select id="v-voice">${opt(config.voices, "en_US-ryan-high")}</select></div>
          <div><label>Quality</label><select id="v-q"><option value="l">480p (fast)</option><option value="m" selected>720p</option><option value="h">1080p</option></select></div>
          <div><label><input type="checkbox" id="v-critic" style="width:auto"> Critic</label></div>
        </div></div>
      ${scripts.map(scriptCard).join("") || `<p class="soft">No script yet.</p>`}
    </div></div>`;
}

function scriptCard(s) {
  const head = `<div class="row"><b>${esc(s.title)}</b><span class="soft">pages ${s.from}–${s.to}</span>
    <span class="chip ${s.status}">${s.status}</span>${s.seconds != null ? `<span class="soft">${secs(s.seconds)}</span>` : ""}
    ${s.cost ? `<span class="money">${usd(s.cost)}</span>` : ""}<span class="soft">${esc(s.settings.model)} · ${s.settings.videos} × ${s.settings.seconds} s</span>
    <span style="flex:1"></span>
    ${s.videos.some((v) => !v.run) ? `<button class="primary" onclick="buildVideos('${s.id}')">Build all not built</button>` : ""}
    <button onclick="dropScript('${s.id}')">Drop</button></div>`;
  return `<div class="card">${head}${s.error ? `<div class="err" style="color:#ff9a9a;white-space:pre-wrap">${esc(s.error)}</div>` : ""}
    ${s.videos.map((v, k) => {
      const ri = v.run_info, words = v.narration.split(/\s+/).filter(Boolean).length;
      return `<div class="vid"><div class="row"><b>${k + 1}.</b><input id="vt-${s.id}-${k}" value="${esc(v.title)}" style="flex:1;width:auto">
        <span class="soft">${words} words ≈ ${Math.round(words / 2.4)} s</span></div>
        <textarea id="vn-${s.id}-${k}" rows="${Math.min(10, v.narration.split("\n").length + 1)}" style="margin-top:6px">${esc(v.narration)}</textarea>
        <div class="row" style="margin-top:6px"><button onclick="saveVideo('${s.id}', ${k})">Save text</button>
          <button class="${v.run ? "" : "primary"}" onclick="buildVideos('${s.id}', ${k})">${v.run ? "Build again" : "Build this video"}</button>
          ${ri ? `<a href="#" onclick="pick('${v.run}');return false" style="color:var(--accent)">open run →</a>
            <span class="chip ${ri.status}">${ri.status}</span><span class="money">${usd(ri.cost)}</span><span class="soft">${ri.tokens || 0} tok${ri.seconds ? ` · ${ri.seconds.toFixed(0)} s` : ""}</span>
            <span class="soft">${Object.entries(ri.steps).map(([n, st]) => `<span class="chip ${st}" title="${n}">${n[0]}</span>`).join(" ")}</span>` : ""}</div>
        ${ri && ri.video ? `<video controls preload="none" style="margin-top:6px;max-width:420px" src="/files/${v.run}/video.mp4?v=${ri.cost}-${ri.status}"></video>` : ""}</div>`;
    }).join("")}</div>`;
}

async function writeScript() {
  const body = {from: range.from, to: range.to, model: $("#s-model").value, videos: +$("#s-videos").value,
    seconds: +$("#s-seconds").value, notes: $("#s-notes").value};
  try { await api(`/api/books/${bsel}/script`, {method: "POST", body: JSON.stringify(body)}); refreshBook(true); loadRuns(); }
  catch (e) { alert(e.message); }
}

async function saveVideo(sid, k) {
  try {
    await api(`/api/books/${bsel}/scripts/${sid}/${k}`, {method: "PUT", body: JSON.stringify({title: $(`#vt-${sid}-${k}`).value, narration: $(`#vn-${sid}-${k}`).value})});
    document.activeElement.blur(); refreshBook(true);
  } catch (e) { alert(e.message); }
}

async function buildVideos(sid, k) {
  if (k != null) await saveVideo(sid, k);
  const body = {script: sid, video: k, model: $("#v-model").value, voice: $("#v-voice").value, quality: $("#v-q").value, critic: $("#v-critic").checked};
  try { await api(`/api/books/${bsel}/build`, {method: "POST", body: JSON.stringify(body)}); refreshBook(true); loadRuns(); }
  catch (e) { alert(e.message); }
}

async function dropScript(sid) {
  if (!confirm("Drop this script? Its videos' runs stay in the runs list.")) return;
  try { await api(`/api/books/${bsel}/scripts/${sid}`, {method: "DELETE"}); refreshBook(true); } catch (e) { alert(e.message); }
}

(async () => {
  config = await api("/api/config");
  const k = $("#key");
  k.textContent = config.key ? "model key set" : "no model key";
  k.className = "chip " + (config.key ? "done" : "failed");
  k.insertAdjacentHTML("afterend", `<span class="chip ${config.datalab ? "done" : "failed"}">${config.datalab ? "Datalab key set" : "no Datalab key"}</span>`);
  await loadRuns();
  setInterval(loadRuns, 8000);
})();
</script>
</body>
</html>
